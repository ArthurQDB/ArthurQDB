<svg width="650" height="160" viewBox="0 0 650 160" xmlns="http://w3.org">
  <style>
    .bg-white { fill: #FFFFFF; }
    .bg-black { fill: #0D0D0D; }
    .accent-red { fill: #E60012; }
    .p5-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 24px;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .typing {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 4px solid #E60012;
      animation: typing 3.5s steps(35, end) infinite, blink 0.75s step-end infinite;
    }
    @keyframes typing {
      0%, 10% { width: 0; }
      70%, 90% { width: 470px; }
      100% { width: 0; }
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>

  <!-- Jagged White Outer Border -->
  <polygon class="bg-white" points="45,35 125,10 140,30 635,15 615,135 110,145 95,120 15,135 65,85 20,75" />
  
  <!-- Red Accent Slash -->
  <polygon class="accent-red" points="580,22 628,20 608,128 565,130" />

  <!-- Inner Black Dialogue Box -->
  <polygon class="bg-black" points="55,42 122,20 135,38 622,25 605,125 115,135 102,112 32,125 75,85 35,77" />

  <!-- Animated Typing Text -->
  <foreignObject x="135" y="60" width="470" height="50">
    <div xmlns="http://w3.org" class="p5-text typing">
      TAKE YOUR HEART...
    </div>
  </foreignObject>
</svg>
